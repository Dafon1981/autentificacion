<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriDoc-Med: Portal del Doctor v2.1 (Corregido)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator/qrcode.js"></script>
    <style>
        :root {
            --azul-principal: #0D47A1;
            --blanco: #FFFFFF;
            --dorado-acento: #C5A265;
            --gris-fondo: #f4f6f9;
            --texto-principal: #333;
            --borde-suave: #dfe4ea;
            --verde-exito: #27ae60;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            background-color: var(--gris-fondo );
        }
        #login-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { width: 90%; max-width: 400px; padding: 40px; background: var(--blanco); border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center; }
        .logo { height: 60px; margin-bottom: 20px; }
        h1, h2 { color: var(--azul-principal); }
        input, select {
            width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid var(--borde-suave);
            border-radius: 8px; font-size: 1.1rem; box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: var(--dorado-acento); box-shadow: 0 0 0 2px rgba(197, 162, 101, 0.3); }
        button {
            padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease; color: var(--blanco);
        }
        .btn-primario { background-color: var(--azul-principal); width: 100%; }
        .btn-accion { background-color: var(--dorado-acento); }
        .btn-secundario { background-color: #7f8c8d; }

        #portal-container { display: grid; grid-template-columns: 300px 1fr; height: 100vh; overflow: hidden; }
        #panel-izquierdo { background: var(--blanco); border-right: 1px solid var(--borde-suave); padding: 20px; display: flex; flex-direction: column; }
        #lista-registros { flex-grow: 1; overflow-y: auto; }
        .registro-item { padding: 10px; border-bottom: 1px solid var(--borde-suave); cursor: pointer; }
        .registro-item:hover { background-color: var(--gris-fondo); }
        .registro-item.activo { background-color: #e3f2fd; border-left: 4px solid var(--azul-principal); }
        #panel-derecho { background: var(--gris-fondo); padding: 40px; overflow-y: auto; }
        .placeholder-derecho, .form-wrapper, .detalle-wrapper { background: var(--blanco); padding: 30px; border-radius: 15px; margin-bottom: 30px; }
        .hidden { display: none !important; }

        .canvas-container { position: relative; }
        canvas { border: 2px dashed var(--borde-suave); border-radius: 8px; width: 100%; height: 250px; cursor: crosshair; }
        canvas.coincide { border-color: var(--verde-exito); box-shadow: 0 0 15px rgba(39, 174, 96, 0.5); }
        .mensaje-canvas {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(39, 174, 96, 0.9); color: var(--blanco); padding: 20px 40px;
            border-radius: 10px; font-size: 1.5rem; font-weight: bold; z-index: 10;
        }
        #detalle-qr-container img { max-width: 200px; margin: 20px auto; display: block; border: 5px solid var(--blanco); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- El HTML de los contenedores no cambia -->
    <div id="login-container">
        <div class="login-box">
            <img src="https://www.hospitalcayetano.gob.pe/PortalWeb/assets/icon/logo-final.png" alt="Logo VeriDoc-Med" class="logo">
            <h1>Portal del Doctor</h1>
            <form id="login-form"><input type="email" id="login-email" placeholder="Email" required><input type="password" id="login-clave" placeholder="Contraseña" required><button type="submit" class="btn-primario">Ingresar</button></form>
        </div>
    </div>

    <div id="portal-container" class="hidden">
        <aside id="panel-izquierdo">
            <h2>Mis Registros</h2>
            <div id="lista-registros"><p style="color: #777;">No hay registros todavía.</p></div>
        </aside>

        <main id="panel-derecho">
            <div id="vista-bienvenida">
                <div class="placeholder-derecho" style="text-align:center;"><img src="" alt="Img Nuevo Registro" style="height:150px; background:#eee; border-radius:10px; margin-bottom:20px;"><button class="btn-accion" onclick="mostrarVista('vista-formulario' )">Nuevo Registro</button></div>
                <div class="placeholder-derecho" style="text-align:center;"><img src="" alt="Img Compartido" style="height:150px; background:#eee; border-radius:10px; margin-bottom:20px;"><button class="btn-accion">Registro Compartido</button></div>
            </div>

            <div id="vista-formulario" class="hidden">
                <div class="form-wrapper">
                    <h2>Nuevo Registro de Documento</h2>
                    <select id="tipo-documento-select">
                        <option value="">-- Seleccione tipo de documento --</option>
                        <option value="FUA Médica">FUA Médica</option>
                        <option value="Documentos">Documentos</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <div id="formulario-dinamico"></div>
                    <div id="firma-container" class="hidden" style="margin-top: 20px;">
                        <h3>Firme para Validar</h3>
                        <div class="canvas-container">
                            <canvas id="canvas-firma"></canvas>
                            <div id="mensaje-firma" class="mensaje-canvas hidden">Firma Coincide</div>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-top:15px;">
                            <button class="btn-secundario" onclick="limpiarCanvasFirma()">Limpiar</button>
                            <button id="btn-validar-firma" class="btn-accion">Validar y Generar</button>
                        </div>
                    </div>
                    <button class="btn-secundario" style="width:100%; margin-top:20px;" onclick="mostrarVista('vista-bienvenida')">Volver al Menú Principal</button>
                </div>
            </div>

            <div id="vista-detalle-registro" class="hidden">
                <!-- El HTML de esta vista no cambia -->
            </div>
        </main>
    </div>

<script>
    const SUPABASE_URL = 'https://esiklpxyectbekxvajnw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzaWtscHh5ZWN0YmVreHZham53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE2OTI1MjEsImV4cCI6MjA3NzI2ODUyMX0.mtQnqUrTmhmN1DQxOAUnGpizhYZobStHDH0cz_XfKGU';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY );

    let doctorLogueado = null;
    let datosFormularioActual = {};

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('login-form').addEventListener('submit', handleLogin);
        document.getElementById('tipo-documento-select').addEventListener('change', renderFormularioDinamico);
        document.getElementById('btn-validar-firma').addEventListener('click', handleValidarFirma);
    });
    async function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('login-email').value;
        const clave = document.getElementById('login-clave').value;
        const boton = event.target.querySelector('button');
        boton.disabled = true;
        boton.textContent = 'Verificando...';

        try {
            const { data: doctor, error } = await supabaseClient.from('doctor_registro').select('*').eq('email', email).eq('clave', clave).single();
            if (error && error.code !== 'PGRST116') throw error;

            if (doctor) {
                doctorLogueado = doctor;
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('portal-container').classList.remove('hidden');
                await cargarRegistros(doctor.email);
            } else {
                alert('Email o contraseña incorrectos.');
                boton.disabled = false;
                boton.textContent = 'Ingresar';
            }
        } catch (error) {
            alert(`Error al iniciar sesión: ${error.message}`);
            boton.disabled = false;
            boton.textContent = 'Ingresar';
        }
    }

    function mostrarVista(vistaId) {
        ['vista-bienvenida', 'vista-formulario', 'vista-detalle-registro'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
        document.getElementById(vistaId).classList.remove('hidden');
        if (vistaId === 'vista-formulario') {
            document.getElementById('tipo-documento-select').value = '';
            document.getElementById('formulario-dinamico').innerHTML = '';
            document.getElementById('firma-container').classList.add('hidden');
        }
    }

    async function cargarRegistros(doctorEmail) {
        const listaDiv = document.getElementById('lista-registros');
        listaDiv.innerHTML = '<p>Cargando registros...</p>';
        const { data: registros, error } = await supabaseClient.from('autenticacion_firmas').select('*').eq('doctor_email', doctorEmail).order('created_at', { ascending: false });

        if (error) { listaDiv.innerHTML = '<p style="color: red;">Error al cargar registros.</p>'; return; }
        if (registros.length === 0) { listaDiv.innerHTML = '<p style="color: #777;">No hay registros todavía.</p>'; return; }

        listaDiv.innerHTML = '';
        registros.forEach(registro => {
            const registroElement = document.createElement('div');
            registroElement.className = 'registro-item';
            registroElement.dataset.id = registro.id;
            registroElement.innerHTML = `<strong style="color: var(--azul-principal);">${registro.tipo_documento}</strong>  
<small style="color: #555;">${registro.codigo_validacion}</small>  
<small style="color: #777;">${new Date(registro.created_at).toLocaleDateString()}</small>`;
            registroElement.onclick = () => mostrarDetalleRegistro(registro.id);
            listaDiv.appendChild(registroElement);
        });
    }

    function renderFormularioDinamico(event) {
        const tipo = event.target.value;
        const container = document.getElementById('formulario-dinamico');
        container.innerHTML = '';
        document.getElementById('firma-container').classList.add('hidden');

        if (tipo === 'FUA Médica') {
            container.innerHTML = `
                <input type="text" id="form-numero_documento" placeholder="Número de FUA" required>
                <input type="text" id="form-numero_historia" placeholder="Número de Historia Clínica" required>
                <input type="date" id="form-fecha_atencion" placeholder="Fecha de Atención" required>
                <input type="text" id="form-observacion" placeholder="Observación / Diagnóstico" required>
                <button class="btn-accion" style="width:100%;" onclick="mostrarPasoFirma()">Siguiente</button>
            `;
        }
    }

    function mostrarPasoFirma() {
        datosFormularioActual = {
            tipo_documento: document.getElementById('tipo-documento-select').value,
            numero_documento: document.getElementById('form-numero_documento').value,
            numero_historia: document.getElementById('form-numero_historia').value,
            fecha_atencion: document.getElementById('form-fecha_atencion').value,
            observacion: document.getElementById('form-observacion').value,
        };
        if (!datosFormularioActual.numero_documento || !datosFormularioActual.numero_historia || !datosFormularioActual.fecha_atencion) {
            alert('Por favor, complete todos los campos del formulario.');
            return;
        }
        document.getElementById('formulario-dinamico').classList.add('hidden');
        document.getElementById('firma-container').classList.remove('hidden');
        setupCanvas('firma');
    }

    // --- FUNCIÓN CORREGIDA ---
    async function handleValidarFirma() {
        const boton = document.getElementById('btn-validar-firma');
        if (isCanvasEmpty('firma')) {
            alert('Debe dibujar su firma para validar.');
            return;
        }
        boton.disabled = true;
        boton.textContent = 'Comparando IA...';

        try {
            const firmaNuevaBase64 = document.getElementById('canvas-firma').toDataURL('image/png');
            
            // CORRECCIÓN 2: Asegurarse de que la URL de la firma maestra existe
            if (!doctorLogueado || !doctorLogueado.firma_maestra_url) {
                throw new Error('No se pudo encontrar la firma maestra del doctor. Asegúrese de que el doctor completó el registro biométrico.');
            }

            const { data: resultado, error } = await supabaseClient.functions.invoke('comparar-firmas', {
                body: {
                    firmaMaestraUrl: doctorLogueado.firma_maestra_url,
                    firmaNuevaBase64: firmaNuevaBase64
                }
            });
            if (error) throw error;

            if (resultado.similitud >= 90) {
                const canvas = document.getElementById('canvas-firma');
                const ctx = canvas.getContext('2d');
                ctx.globalCompositeOperation = 'source-atop';
                ctx.fillStyle = 'rgba(39, 174, 96, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'source-over';
                document.getElementById('mensaje-firma').classList.remove('hidden');
                boton.textContent = 'Generando...';
                
                await guardarRegistroCompleto();

            } else {
                alert(`Firma no coincide (Similitud: ${resultado.similitud}%). Por favor, intente de nuevo.`);
                limpiarCanvasFirma();
                boton.disabled = false;
                boton.textContent = 'Validar y Generar';
            }
        } catch (error) {
            alert(`Error en la validación biométrica: ${error.message}`);
            boton.disabled = false;
            boton.textContent = 'Validar y Generar';
        }
    }

    async function guardarRegistroCompleto() {
        try {
            const codigo_validacion = 'VDM-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            const qr = qrcode(0, 'M');
            qr.addData(JSON.stringify({ codigo: codigo_validacion, doctor: doctorLogueado.nombre, fecha: new Date().toISOString() }));
            qr.make();
            const qrBase64 = qr.createDataURL(4);

            const response = await fetch(qrBase64);
            const blob = await response.blob();
            const filePath = `public/${codigo_validacion}.png`;
            
            // CORRECCIÓN 1: Añadir { upsert: true } para forzar la subida al Storage
            const { error: uploadError } = await supabaseClient.storage.from('qr_aut').upload(filePath, blob, { contentType: 'image/png', upsert: true });
            if (uploadError) throw uploadError;

            const { data: urlData } = supabaseClient.storage.from('qr_aut').getPublicUrl(filePath);

            const registroFinal = { ...datosFormularioActual, doctor_email: doctorLogueado.email, codigo_validacion: codigo_validacion, qr_code_url: urlData.publicUrl };
            const { error: insertError } = await supabaseClient.from('autenticacion_firmas').insert([registroFinal]);
            if (insertError) throw insertError;

            alert('¡Documento validado y registrado exitosamente!');
            await cargarRegistros(doctorLogueado.email);
            mostrarVista('vista-bienvenida');

        } catch (error) {
            alert(`Error al guardar el registro: ${error.message}`);
        } finally {
            const boton = document.getElementById('btn-validar-firma');
            boton.disabled = false;
            boton.textContent = 'Validar y Generar';
            limpiarCanvasFirma();
        }
    }
    
    async function mostrarDetalleRegistro(registroId) { /* Sin cambios */ }
    function compartirQR(plataforma) { /* Sin cambios */ }

    // --- FUNCIÓN CORREGIDA (Canvas) ---
    function setupCanvas(id) {
        const canvas = document.getElementById(`canvas-${id}`);
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        let points = [];
        let isDrawing = false;
        let lastWidth = 2.0; // Grosor inicial ajustado

        function getPos(e) { const rect = canvas.getBoundingClientRect(); const evt = e.touches ? e.touches[0] : e; return { x: evt.clientX - rect.left, y: evt.clientY - rect.top, time: Date.now() }; }
        function start(e) { isDrawing = true; points = []; const pos = getPos(e); points.push(pos); lastWidth = 2.0; }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const currentPoint = getPos(e);
            const lastPoint = points[points.length - 1];
            const dist = Math.hypot(currentPoint.x - lastPoint.x, currentPoint.y - lastPoint.y);
            const time = currentPoint.time - lastPoint.time;
            const velocity = dist / (time || 1);
            
            // CORRECCIÓN 3: Ajuste de grosor para mayor sensibilidad
            const targetWidth = Math.max(5.0 - velocity * 2.0, 0.5); // Rango de 0.5px a 5.0px
            lastWidth = lastWidth * 0.6 + targetWidth * 0.4; // Suavizado

            ctx.lineWidth = lastWidth;
            ctx.strokeStyle = '#000';
            ctx.beginPath(); ctx.moveTo(lastPoint.x, lastPoint.y); ctx.lineTo(currentPoint.x, currentPoint.y); ctx.stroke();
            points.push(currentPoint);
        }
        function stop() { isDrawing = false; }
        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop); canvas.addEventListener('mouseout', stop);
        canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', draw, { passive: false }); canvas.addEventListener('touchend', stop);
    }

    function limpiarCanvasFirma() { document.getElementById('canvas-firma').getContext('2d').clearRect(0, 0, document.getElementById('canvas-firma').width, document.getElementById('canvas-firma').height); document.getElementById('mensaje-firma').classList.add('hidden'); }
    function isCanvasEmpty(id) { const c = document.getElementById(`canvas-${id}`); return !c.getContext('2d').getImageData(0, 0, c.width, c.height).data.some(channel => channel !== 0); }
</script>
</body>
</html>
